name: Build Android APK

# Builds the native Android app (android/) into an installable debug APK and,
# on main, publishes it to a GitHub Release. The pure-Kotlin :engine tests run
# first as a correctness gate.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - android-app
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/gradle/libs.versions.toml', 'android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Run engine unit tests
        run: ./gradlew :engine:test --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Stage APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/PKTracker-android.apk"

      - name: Resolve version tag
        id: v
        run: |
          v=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "tag=android-v$v" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PKTracker-android
          path: PKTracker-android.apk

      - name: Publish release (main only)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: PK Tracker for Android ${{ steps.v.outputs.tag }}
          body: |
            ## PK Tracker — Android

            Download **PKTracker-android.apk** below and open it on your Android
            phone. When prompted, allow installing from this source (Settings →
            "Install unknown apps"). This is a debug build, not a Play Store
            release.

            Estimates from population-average pharmacokinetic models. Not medical
            advice. Never use alcohol figures to decide whether to drive.
          files: ${{ github.workspace }}/PKTracker-android.apk
          fail_on_unmatched_files: true
